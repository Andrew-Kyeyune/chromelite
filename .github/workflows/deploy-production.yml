# Deploys the LIVE website (www.chromelitedigital.co.ug) to the production server.
# Runs when changes are merged into `main` (or manually from the Actions tab),
# waits for approval in the "production" environment, then uploads /out over FTPS.
name: Deploy to production
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.chromelitedigital.co.ug
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the production website
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: production

      - name: Upload to the live server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
